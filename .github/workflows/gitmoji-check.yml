name: Gitmoji Commit Lint

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate-gitmoji:
    name: Validate Gitmoji Commit Messages
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: setup-python@v5
        with:
          python-version: '3.11'

      - name: Validate Commit Messages
        run: |
          python3 - << 'EOF'
          import re
          import subprocess
          import sys

          # Regex for Unicode emoji or :shortcode: at start of line
          # Matches standard emoji Unicode blocks or :[a-zA-Z0-9_+-]+:
          EMOJI_PATTERN = re.compile(
              r'^('
              r':\w+:'                               # :shortcode:
              r'|[\U00010000-\U0010ffff]'            # SMP emojis (e.g. 🚀, 🧠, 🧪, 🧱)
              r'|[\u2600-\u27bf]'                    # Miscellaneous symbols & Dingbats (e.g. ✨, ⚡, ⚙️, 🔒)
              r'|[\u2300-\u23ff]'                    # Misc Technical
              r'|[\u2b50\u2b55]'                     # Stars & heavy circles
              r'|\ud83c[\udf00-\udfff]'              # Emoji surrogate pairs
              r'|\ud83d[\udc00-\ude4f\ude80-\udeff]'
              r'|\ud83e[\udd00-\uddff]'
              r')'
          )

          def check_message(commit_hash, subject):
              # Skip automated merge commits
              if subject.startswith("Merge ") or subject.startswith("Revert "):
                  print(f"⏩ [SKIP] {commit_hash[:7]} (Merge/Revert): {subject}")
                  return True
              
              if EMOJI_PATTERN.match(subject.strip()):
                  print(f"✅ [PASS] {commit_hash[:7]}: {subject}")
                  return True
              else:
                  print(f"❌ [FAIL] {commit_hash[:7]}: {subject}")
                  print("   Commit message must start with a Gitmoji (Unicode emoji or :shortcode:).")
                  print("   See CONTRIBUTING.md or https://gitmoji.dev for guidance.")
                  return False

          # Fetch commit range based on event
          if "${{ github.event_name }}" == "pull_request":
              base_sha = "${{ github.event.pull_request.base.sha }}"
              head_sha = "${{ github.event.pull_request.head.sha }}"
              cmd = ["git", "log", f"{base_sha}..{head_sha}", "--pretty=format:%H %s"]
          else:
              # For pushes, check commits in the push event or last commit
              cmd = ["git", "log", "-n", "10", "--pretty=format:%H %s"]

          try:
              output = subprocess.check_output(cmd, text=True).strip()
          except Exception as e:
              print(f"Error fetching commits: {e}")
              sys.exit(1)

          if not output:
              print("No new commits to check.")
              sys.exit(0)

          failed = False
          for line in output.splitlines():
              if not line.strip():
                  continue
              parts = line.split(" ", 1)
              h = parts[0]
              s = parts[1] if len(parts) > 1 else ""
              if not check_message(h, s):
                  failed = True

          if failed:
              print("\n⛔ One or more commit messages violated the Gitmoji style guide.")
              sys.exit(1)

          print("\n🎉 All commit messages adhere to the Gitmoji standard.")
          EOF
